    if (ready) notes.push("The engine found no blocking obligations. Whether the change does what you intend is your decision.");
    else notes.push("Blocking obligations: " + obligationList(data.readiness.obligationIds) + ". The proposed graph is incomplete until each has a value.");
    if (!data.baseIsCommitted) notes.unshift(staleNote);
    var proposed = data.changedFunctions.map(function (item) { return item.proposed; });
    var declarations = data.declaredTypes.length + data.declaredCapabilities.length + data.declaredEffects.length;
    var rewritten = data.changedFunctions.filter(function (item) { return item.committed !== null; }).length;
    var facts = [];
    if (rewritten > 0) facts.push(fact(rewritten, "function rewritten", "functions rewritten"));
    if (data.changedFunctions.length > rewritten) facts.push(fact(data.changedFunctions.length - rewritten, "function created", "functions created"));
    if (declarations > 0) facts.push(fact(declarations, "declaration created or updated", "declarations created or updated"));
    facts.push(fact(proposed.reduce(function (sum, focus) { return sum + focus.openObligations.length; }, 0), "open obligation", "open obligations"));
    facts.push(fact(proposed.reduce(function (sum, focus) { return sum + unresolvedCount(focus); }, 0), "unresolved declaration", "unresolved declarations"));
    emitVerdict(w, state, ready ? (data.baseIsCommitted ? "ok" : "warn") : "bad", notes, facts);
    emitIds(w, [["Proposal", "transaction:" + data.transactionId], ["Base snapshot", "snapshot:" + data.baseSnapshotId], ["Proposed snapshot", "snapshot:" + data.proposedSnapshotId]]);
    w.line("</header>");

    w.line("<section>" + heading(2, "What changed"));
    w.line("<ul class=\"changes\">");
    var described = false;
    data.changedFunctions.forEach(function (item, index) {
      var fn = item.proposed.function;
      if (target && target.ownerFunctionId === fn.id) {
        emitTargetChange(w, names, target, fn, graphContext(names, "p" + index, item.proposed.graph, null));
        described = true;
      } else {
        w.line("<li><a href=\"#f" + index + "\">" + html(fn.displayName) + "</a>: " +
          (item.committed !== null ? "body rewritten" : "new function") + ", returns " + code(typeText(names, fn.resultType)) + ".</li>");
        described = true;
      }
    });
    [["type", data.declaredTypes], ["capability", data.declaredCapabilities], ["effect", data.declaredEffects]].forEach(function (entry) {
      entry[1].forEach(function (item) { w.line("<li>" + entry[0].charAt(0).toUpperCase() + entry[0].slice(1) + " " + named(entry[0], item.id, item.displayName) + " created or updated.</li>"); described = true; });
    });
    if (!described) w.line("<li>The engine reports no function or declaration changes.</li>");
    w.line("</ul></section>");

    if (verification) {
      w.line("<section>" + heading(2, "Behavioral verification") + verificationBanner(verification));
      w.line("<details><summary>Saved verification report <span class=\"note\">JSON</span></summary><p>Explicit cases only. Tested agreement is not proof. This saved report is historical evidence for the fingerprints below; rerun verifyChange after editing.</p><pre>" +
        html(indentedJson(verification)) + "</pre></details></section>");
    }

    if (data.changedFunctions.length > 0) {
      w.line("<section>" + heading(2, "Functions created or rewritten"));
      data.changedFunctions.forEach(function (item, index) {
        var fn = item.proposed.function;
        var changed = target && target.ownerFunctionId === fn.id ? target.targetNodeId : null;
        w.line("<article id=\"f" + index + "\">" + heading(3, html(fn.displayName) + " <span class=\"status\">" + statusOf(item) + "</span>"));
        if (item.committed !== null) {
          w.line("<details><summary>Proposed <span class=\"note\">after this change</span></summary>");
          emitFocusBody(w, item.proposed, { top: 3, names: names, prefix: "p" + index, embedded: true, changed: changed });
          w.line("</details>");
          w.line("<details><summary>Committed <span class=\"note\">before this change</span></summary>");
          emitFocusBody(w, item.committed, { top: 3, names: names, prefix: "c" + index, embedded: true, changed: changed });
          w.line("</details>");
        } else emitFocusBody(w, item.proposed, { top: 3, names: names, prefix: "p" + index, embedded: true, changed: changed });
        w.line("</article>");
      });
      w.line("</section>");
    }
    if (declarations > 0) {
      w.line("<section>" + heading(2, "Declarations created or updated"));
      if (data.declaredTypes.length > 0) {
        w.line(heading(3, "Types"));
        data.declaredTypes.forEach(function (type) { emitTypeEntity(w, names, type); });
      }
      if (data.declaredCapabilities.length > 0) {
        w.line(heading(3, "Capabilities"));
        data.declaredCapabilities.forEach(function (capability) { emitCapability(w, names, capability); });
      }
      if (data.declaredEffects.length > 0) {
        w.line(heading(3, "Effects"));
        emitEffects(w, data.declaredEffects);
      }
      w.line("</section>");
    }
  }

  // Every type and capability a type reference names, nested ones included.
  function referencedIds(type, types, capabilities) {
    switch (type.kind) {
      case "named": types.add(type.typeId); (type.arguments || []).forEach(function (item) { referencedIds(item, types, capabilities); }); break;
      case "capability": capabilities.add(type.capabilityId); break;
      case "builtinGeneric": type.arguments.forEach(function (item) { referencedIds(item, types, capabilities); }); break;
      case "function":
        type.parameters.forEach(function (item) { referencedIds(item, types, capabilities); });
        referencedIds(type.resultType, types, capabilities);
        break;
    }
  }
  function eachNode(graph, visit) {
    graph.nodes.forEach(function (node) {
      visit(node);
      node.branches.forEach(function (branch) { eachNode(branch.graph, visit); });
    });
  }
  // Function IDs by the key each one is filed under, in function order and without repeats.
  function Index() { this.map = new Map(); }
  Index.prototype.add = function (key, functionId) {
    if (!this.map.has(key)) this.map.set(key, []);
    var list = this.map.get(key);
    if (list.indexOf(functionId) < 0) list.push(functionId);
  };
  Index.prototype.get = function (key) { return this.map.get(key) || []; };

  // The program view: an overview of how functions, types, effects and capabilities connect, grouped from
  // the engine's facts in the data (signatures, call sites, node relations, effect evidence), then every
  // function's own focus.
  function renderProgram(w, data) {
    var names = new Map(), anchors = new Map();
    data.types.forEach(function (type) { addTypeNames(names, type); });
    data.capabilities.forEach(function (capability) { addCapabilityNames(names, capability); });
    addNames(names, data.effects);
    data.functions.forEach(function (focus, index) { addFocusNames(names, focus); anchors.set(focus.function.id, "fn" + index); });
    var ctx = { names: names, functions: anchors };
    var fnList = function (ids) { return ids.length === 0 ? "<span class=\"muted\">none</span>" : ids.map(function (id) { return functionRef(ctx, id); }).join(", "); };

    var takes = new Index(), returns = new Index(), constructs = new Index(), reads = new Index();
    var takesCapability = new Index(), invokes = new Index(), requires = new Index(), arises = new Index();
    var fieldOwner = new Map(), operationOwner = new Map();
    data.types.forEach(function (type) { (type.typeKind.fields || []).forEach(function (field) { fieldOwner.set(field.id, type.id); }); });
    data.capabilities.forEach(function (capability) { capability.operations.forEach(function (operation) { operationOwner.set(operation.id, capability.id); }); });
    data.functions.forEach(function (focus) {
      var fn = focus.function, id = fn.id;
      var taken = new Set(), takenCapabilities = new Set(), returned = new Set();
      fn.parameters.forEach(function (parameter) { referencedIds(parameter.type, taken, takenCapabilities); });
      referencedIds(fn.resultType, returned, takenCapabilities);
      taken.forEach(function (typeId) { takes.add(typeId, id); });
      returned.forEach(function (typeId) { returns.add(typeId, id); });
      takenCapabilities.forEach(function (capabilityId) { takesCapability.add(capabilityId, id); });
      fn.requiredEffects.forEach(function (effectId) { requires.add(effectId, id); });
      focus.bodyEffectRequirements.evidence.forEach(function (item) { arises.add(item.effectId, id); });
      eachNode(focus.graph, function (node) {
        node.relations.forEach(function (relation) {
          if (relation.kind === "ConstructsType") constructs.add(relation.id, id);
          else if (relation.kind === "AccessesField" && fieldOwner.has(relation.id)) reads.add(fieldOwner.get(relation.id), id);
          else if (relation.kind === "InvokesCapabilityOperation" && operationOwner.has(relation.id)) invokes.add(operationOwner.get(relation.id), id);
        });
      });
    });

    var exported = data.functions.filter(function (focus) { return focus.function.exported; }).length;
    var uncalled = data.functions.filter(function (focus) { return !focus.function.exported && focus.callers.length === 0; });
    w.line("<header><h1>Program</h1>");
    w.line("<p class=\"muted\">The committed snapshot: how its functions, types, effects and capabilities connect, then each function's body.</p>");
    w.line("<ul class=\"facts\"><li>" + fact(data.functions.length, "function", "functions") + " (" + exported + " exported)</li><li>" +
      fact(data.types.length, "type", "types") + "</li><li>" + fact(data.capabilities.length, "capability", "capabilities") + "</li><li>" +
      fact(data.effects.length, "effect", "effects") + "</li></ul>");
    emitIds(w, [["Snapshot", "snapshot:" + data.snapshotId]]);
    w.line("</header>");
    // Filled and wired by the page script: section links, and a name filter over the Calls rows and function sections.
    w.line("<div class=\"toolbar\" role=\"search\"><label>Find function <input type=\"search\" id=\"fn-filter\" autocomplete=\"off\" spellcheck=\"false\" aria-keyshortcuts=\"/\"></label> " +
      "<label><input type=\"checkbox\" id=\"fn-exported\"> Exported only</label> <span id=\"fn-count\" class=\"muted\" role=\"status\"></span>" +
      "<nav aria-label=\"Sections\"></nav><span class=\"muted\">Press <kbd>/</kbd> to search</span></div>");
    var filterKey = function (fn) { return " data-fn=\"" + html(fn.displayName.toLowerCase()) + "\"" + (fn.exported ? " data-exported" : ""); };

    emitOverview(w, ctx, data);
    w.line("<section id=\"calls\">" + heading(2, "Calls"));
    w.line("<p class=\"muted\">Exported functions are the entry points. A private function nobody calls is dead code" +
      (uncalled.length === 0 ? "; there is none." : ": " + fnList(uncalled.map(function (focus) { return focus.function.id; })) + ".") + "</p>");
    if (data.functions.length === 0) w.line("<p>No functions.</p>");
    else {
      w.line("<div class=\"table-scroll\"><table class=\"name-table\"><thead><tr><th scope=\"col\">Function</th><th scope=\"col\">Calls</th><th scope=\"col\">Called by</th></tr></thead><tbody>");
      data.functions.forEach(function (focus) {
        var unique = function (sites, key) { var seen = []; sites.forEach(function (site) { if (seen.indexOf(site[key]) < 0) seen.push(site[key]); }); return seen; };
        w.line("<tr" + filterKey(focus.function) + "><td>" + functionRef(ctx, focus.function.id) + (focus.function.exported ? " <span class=\"status\">exported</span>" : "") + "</td><td>" +
          fnList(unique(focus.callees, "calleeFunctionId")) + "</td><td>" + fnList(unique(focus.callers, "callerFunctionId")) + "</td></tr>");
      });
      w.line("</tbody></table></div>");
    }
    w.line("</section>");

    w.line("<section id=\"type-usage\">" + heading(2, "Type usage"));
    if (data.types.length === 0) w.line("<p>No types.</p>");
    else {
      w.line("<div class=\"table-scroll\"><table class=\"name-table\"><thead><tr><th scope=\"col\">Type</th><th scope=\"col\">Taken by</th><th scope=\"col\">Returned by</th><th scope=\"col\">Constructed in</th><th scope=\"col\">Fields read in</th></tr></thead><tbody>");
      data.types.forEach(function (type) {
        var product = type.typeKind.kind === "product";
        w.line("<tr><td><a href=\"#ty-" + html(type.id) + "\" title=\"" + html("type:" + type.id) + "\">" + html(type.displayName) + "</a> <span class=\"status\">" + (product ? "product" : "union") +
          "</span></td><td>" + fnList(takes.get(type.id)) + "</td><td>" + fnList(returns.get(type.id)) + "</td><td>" + fnList(constructs.get(type.id)) +
          "</td><td>" + (product ? fnList(reads.get(type.id)) : "<span class=\"muted\">n/a</span>") + "</td></tr>");
      });
      w.line("</tbody></table></div>");
    }
    w.line("</section>");

    w.line("<section id=\"effects\">" + heading(2, "Effects and capabilities"));
    if (data.effects.length === 0) w.line("<p>No effects.</p>");
    else {
      w.line("<div class=\"table-scroll\"><table class=\"name-table\"><thead><tr><th scope=\"col\">Effect</th><th scope=\"col\">Declared as required by</th><th scope=\"col\">Arises in the body of</th></tr></thead><tbody>");
      data.effects.forEach(function (effect) {
        w.line("<tr><td title=\"" + html("effect:" + effect.id) + "\">" + html(effect.displayName) + "</td><td>" + fnList(requires.get(effect.id)) + "</td><td>" + fnList(arises.get(effect.id)) + "</td></tr>");
      });
      w.line("</tbody></table></div>");
    }
    if (data.capabilities.length === 0) w.line("<p>No capabilities.</p>");
    else {
      w.line("<div class=\"table-scroll\"><table class=\"name-table\"><thead><tr><th scope=\"col\">Capability</th><th scope=\"col\">Operations</th><th scope=\"col\">Taken by</th><th scope=\"col\">Invoked in</th></tr></thead><tbody>");
      data.capabilities.forEach(function (capability) {
        w.line("<tr><td title=\"" + html("capability:" + capability.id) + "\">" + html(capability.displayName) + "</td><td>" +
          (capability.operations.length === 0 ? "<span class=\"muted\">none</span>" : sortById(capability.operations).map(function (operation) { return html(operation.displayName); }).join(", ")) +
          "</td><td>" + fnList(takesCapability.get(capability.id)) + "</td><td>" + fnList(invokes.get(capability.id)) + "</td></tr>");
      });
      w.line("</tbody></table></div>");
    }
    w.line("</section>");

    w.line("<section id=\"functions\">" + heading(2, "Functions"));
    if (data.functions.length === 0) w.line("<p>No functions.</p>");
    data.functions.forEach(function (focus, index) {
      var fn = focus.function;
      var signature = "(" + fn.parameters.map(function (parameter) { return parameter.displayName + ": " + typeText(names, parameter.type); }).join(", ") + ") -> " + typeText(names, fn.resultType) +
        (fn.requiredEffects.length === 0 ? "" : " ! " + fn.requiredEffects.map(function (id) { return nameOf(names, "effect", id); }).join(", "));
      w.line("<article id=\"fn" + index + "\"" + filterKey(fn) + ">" + heading(3, html(fn.displayName) + (fn.exported ? " <span class=\"status\">exported</span>" : "") + "<code class=\"sig\">" + html(signature) + "</code>"));
      w.line("<details><summary>Body and details</summary>");
      emitFocusBody(w, focus, { top: 3, names: names, prefix: "f" + index, embedded: true, changed: null, functions: anchors });
      w.line("</details></article>");
    });
    w.line("</section>");

    if (data.types.length + data.capabilities.length + data.effects.length > 0) {
      w.line("<section id=\"declarations\">" + heading(2, "Declarations"));
      if (data.types.length > 0) {
        w.line(heading(3, "Types"));
        data.types.forEach(function (type) { w.line("<div id=\"ty-" + html(type.id) + "\">"); emitTypeEntity(w, names, type); w.line("</div>"); });
      }
      if (data.capabilities.length > 0) {
        w.line(heading(3, "Capabilities"));
        data.capabilities.forEach(function (capability) { emitCapability(w, names, capability); });
      }
      if (data.effects.length > 0) {
        w.line(heading(3, "Effects"));
        emitEffects(w, data.effects);
      }
      w.line("</section>");
    }
  }

  // The index of nyrwvy-views: every view page in the directory, grouped by the kind its file name starts with.
  function renderIndex(w, data) {
    var kinds = [["nyrwvy-program", "Program"], ["nyrwvy-focus-", "Function focus"], ["nyrwvy-change-review-", "Change review"]];
    var groups = kinds.map(function (kind) { return { title: kind[1], prefix: kind[0], files: [] }; }).concat([{ title: "Other", prefix: "", files: [] }]);
    data.files.forEach(function (file) {
      for (var i = 0; i < groups.length; i++) if (file.lastIndexOf(groups[i].prefix, 0) === 0) { groups[i].files.push(file); return; }
    });
    w.line("<header><h1>Nyrwvy views</h1><p class=\"muted\">The view pages in this directory, rewritten each time a view is written here.</p></header>");
    if (data.files.length === 0) w.line("<p>No views yet.</p>");
    groups.forEach(function (group) {
      if (group.files.length === 0) return;
      w.line("<section>" + heading(2, html(group.title) + " <span class=\"status\">" + group.files.length + "</span>") + "<ul>");
      group.files.forEach(function (file) {
        var label = file.slice(group.prefix.length).replace(/\.html$/, "") || group.title;
        // A focus page ends in its function's stable ID, which tells same-named functions apart.
        var id = /^(.+)-([0-9a-f]{8}-[0-9a-f-]{27})$/.exec(label);
        w.line("<li><a href=\"" + html(encodeURIComponent(file)) + "\">" + html(id === null ? label : id[1]) + "</a>" + (id === null ? "" : " <span class=\"muted\" title=\"" + html(id[2]) + "\">" + html(id[2].slice(0, 8)) + "</span>") + "</li>");
      });
      w.line("</ul></section>");
    });
  }

  // The page title and body markup of one viewer data object.
  function render(data) {
    var w = new Writer();
    var title;
    w.line("<main>");
    if (data.index) w.line("<nav class=\"back\" aria-label=\"Views\"><a href=\"index.html\">&larr; All views</a></nav>");
    switch (data.view) {
      case "functionFocus":
        title = "Nyrwvy Focus — " + data.focus.function.displayName;
        emitFocusBody(w, data.focus, { top: 1, names: addFocusNames(new Map(), data.focus), prefix: "f", embedded: false, changed: null });
        break;
      case "changeReview": title = "Nyrwvy Change Review"; renderChangeReview(w, data); break;
      case "program": title = "Nyrwvy Program"; renderProgram(w, data); break;
      case "index": title = "Nyrwvy views"; renderIndex(w, data); break;
      case "proposalReview": title = "Nyrwvy Change Review — " + data.proposalKind; renderProposalReview(w, data); break;
      default: throw new Error("Unknown view " + data.view);
    }
    w.line("</main>");
    return { title: title, body: w.toString() };
  }

  if (typeof document !== "undefined") {
    var page = render(JSON.parse(document.getElementById("nyrwvy-data").textContent));
    document.title = page.title;
    document.body.innerHTML = page.body;
    // A link to a node inside a closed focus opens the focus around it, then shows the node.
    var reveal = function () {
      var id = "";
      try { id = decodeURIComponent(location.hash.slice(1)); } catch (error) { return; }
      var target = id === "" ? null : document.getElementById(id);
      if (target === null) return;
      for (var shown = target; shown !== null; shown = shown.parentElement) shown.hidden = false;
      for (var parent = target.parentElement; parent !== null; parent = parent.parentElement) if (parent.tagName === "DETAILS") parent.open = true;
      // A link to a function's section also opens its body.
      var own = target.tagName === "ARTICLE" ? target.querySelector(":scope > details") : null;
      if (own !== null) own.open = true;
      target.scrollIntoView();
    };
    window.addEventListener("hashchange", reveal);
    document.addEventListener("click", function (event) {
      var link = event.target instanceof Element ? event.target.closest("a[href^=\"#\"]") : null;
      if (link !== null && link.getAttribute("href") === location.hash) reveal();
    });
    reveal();
    var filter = document.getElementById("fn-filter");
    if (filter !== null) {
      var nav = document.querySelector(".toolbar nav");
      document.querySelectorAll("main > section[id] > h2").forEach(function (h2) {
        var link = document.createElement("a");
        link.href = "#" + h2.parentElement.id;
        link.textContent = h2.textContent;
        nav.appendChild(link);
      });
      var exportedOnly = document.getElementById("fn-exported"), count = document.getElementById("fn-count");
      var keyed = document.querySelectorAll("[data-fn]");
      var apply = function () {
        var wanted = filter.value.trim().toLowerCase(), only = exportedOnly.checked, total = 0, matched = 0;
        keyed.forEach(function (element) {
          var hide = (only && !element.hasAttribute("data-exported")) || element.getAttribute("data-fn").indexOf(wanted) < 0;
          element.hidden = hide;
          if (element.tagName === "ARTICLE") { total++; if (!hide) matched++; }
        });
        count.textContent = wanted === "" && !only ? "" : matched + " of " + total + " functions";
      };
      filter.addEventListener("input", apply);
      exportedOnly.addEventListener("change", apply);
      document.addEventListener("keydown", function (event) {
        var typing = event.target instanceof Element && event.target.closest("input, textarea, select, [contenteditable]") !== null;
        if (event.key === "/" && !typing && !event.ctrlKey && !event.metaKey && !event.altKey) { event.preventDefault(); filter.focus(); }
      });
    }
  }
  return { render: render, layout: layout };
})();
</script>
</body>
</html>
