name: Extended

# The extended suite runs here only on demand, together with the suite partition audit
# (see docs/developer/verification.md).
on:
  workflow_dispatch:

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  extended:
    name: Extended suite and suite partition audit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Install fish for the maintained entry point
        run: sudo apt-get update && sudo apt-get install --yes fish

      - name: Build the solution
        run: dotnet build Nyrwvy.slnx --configuration Release

      - name: Audit fast and extended suite partition
        run: node scripts/check-test-suite-partition.mjs

      - name: Test extended suite through the maintained entry point
        run: fish scripts/test-extended.fish --no-build --no-restore
