name: Extended

# The extended suite runs here only on demand, together with the suite partition audit
# (see docs/developer/verification.md). The 2-vCPU runner runs Node test files one at a
# time, so the Node pipelines are split round-robin across separate runners instead.
on:
  workflow_dispatch:

concurrency:
  group: extended-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dotnet:
    name: xUnit extended suite and suite partition audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the solution
        run: dotnet build Nyrwvy.slnx --configuration Release

      - name: Audit fast and extended suite partition
        run: node scripts/check-test-suite-partition.mjs

      - name: Test xUnit extended suite
        run: dotnet test Nyrwvy.slnx --configuration Release --settings tests/extended.runsettings --no-build --no-restore

  node:
    name: Node extended shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      # A flaky shard must not cancel the others; every shard reports.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install locked Node dependencies
        run: npm ci --no-audit --no-fund

      - name: Build the solution
        run: dotnet build Nyrwvy.slnx --configuration Release

      - name: Test Node extended shard
        run: node scripts/run-node-tests.mjs extended --shard ${{ matrix.shard }}/${{ strategy.job-total }}
