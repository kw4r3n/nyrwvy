name: CI

# A change that touches only documentation runs no CI: nothing here reads docs/ or README.md.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'README.md'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded pull request runs are cancelled; every push to main keeps its own run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  foundation:
    name: F# foundation build and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node for authoring tool contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Bun for adapter unit tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Install locked adapter and typechecking dependencies
        run: npm ci --no-audit --no-fund

      # Installing fish waits mostly on the network and dpkg, so it runs beside the build, which
      # needs every core (running the Node checks there too made the build slower by as much as
      # they took). It writes its log and exit status; the step after the build waits for them.
      - name: Start fish installation beside the build
        run: |
          ( set +e; { sudo apt-get update && sudo apt-get install --yes fish; } > "$RUNNER_TEMP/fish.log" 2>&1; echo $? > "$RUNNER_TEMP/fish.status" ) < /dev/null > /dev/null 2>&1 &

      - name: Restore fast test graph
        run: dotnet restore tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj

      - name: Build fast test graph
        run: dotnet build tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj --configuration Release --no-restore

      - name: Install fish for maintained verification entry points
        run: scripts/ci-wait.sh fish

      - name: Typecheck maintained adapters and Bun tests
        run: npm run typecheck

      - name: Test shared schemas and typechecking contracts
        run: npm run test:adapters

      - name: Test Bun adapter contracts without live models
        run: npm run test:bun

      - name: Check fish syntax and offline script contracts
        run: |
          git ls-files -z '*.fish' | xargs -0 -r -n 1 fish --no-execute
          fish scripts/tests/m2-listmap-evaluation-summary.test.fish

      - name: Test fast suite and authoring tools through the maintained entry point
        run: fish scripts/test-fast.fish --no-build --no-restore

      - name: Test evaluation transport regressions without live models
        run: node --experimental-strip-types --test .opencode/tests/nyrwvy-evaluation-transport.test.mjs

      - name: Test MCP transport contract
        run: npm --prefix tools/nyrwvy-mcp test

