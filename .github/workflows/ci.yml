name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: F# foundation build and fast tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore fast test graph
        run: dotnet restore tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj

      - name: Build fast test graph
        run: dotnet build tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj --configuration Release --no-restore

      - name: Test fast suite
        run: dotnet test tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj --configuration Release --no-build --no-restore --settings tests/fast.runsettings

      - name: Materialize Mini Work Planner TimedOut probe
        if: github.head_ref == 'authoring/timedout-maintenance-probe'
        run: |
          cp mini-work-planner/planner.snapshot.json /tmp/mini-work-planner-timedout.snapshot.json
          dotnet build tools/Nyrwvy.AuthoringSession/Nyrwvy.AuthoringSession.fsproj --configuration Release
          python3 - <<'PY'
          import json
          import pathlib
          import subprocess

          repo = pathlib.Path.cwd()
          snapshot = pathlib.Path("/tmp/mini-work-planner-timedout.snapshot.json")
          project = repo / "tools" / "Nyrwvy.AuthoringSession" / "Nyrwvy.AuthoringSession.fsproj"

          proc = subprocess.Popen(
              [
                  "dotnet", "run", "--project", str(project),
                  "--configuration", "Release", "--no-build", "--",
                  "open", "--snapshot", str(snapshot),
              ],
              cwd=repo,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )

          def exchange(payload):
              proc.stdin.write(json.dumps(payload, separators=(",", ":")) + "\n")
              proc.stdin.flush()
              line = proc.stdout.readline()
              if not line:
                  raise RuntimeError(proc.stderr.read())
              response = json.loads(line)
              if not response.get("ok"):
                  raise RuntimeError(response)
              return response["result"]

          before = exchange({"id": "before", "op": "declarations"})
          types = {item["displayName"]: item for item in before["types"]}
          functions = {item["displayName"]: item for item in before["functions"]}
          execution = types["ExecutionState"]
          failed = next(item for item in execution["typeKind"]["variants"] if item["displayName"] == "Failed")
          next_action = functions["next_action"]

          proposal = exchange({
              "id": "evolve",
              "op": "simulateAddFieldlessUnionVariantLike",
              "typeId": execution["id"],
              "sourceVariantId": failed["id"],
              "displayName": "TimedOut",
          })
          review = proposal["review"]
          assert review["kind"] == "fieldlessUnionVariantEvolution"
          assert next_action["id"] in review["repairedFunctionIds"]
          assert review["repairedMatchCount"] >= 1
          exchange({"id": "commit", "op": "commit", "proposalId": proposal["proposalId"]})

          proc.stdin.close()
          rc = proc.wait(timeout=30)
          if rc != 0:
              raise RuntimeError(proc.stderr.read())

          reopened = subprocess.Popen(
              [
                  "dotnet", "run", "--project", str(project),
                  "--configuration", "Release", "--no-build", "--",
                  "open", "--snapshot", str(snapshot),
              ],
              cwd=repo,
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
          )
          proc = reopened
          after = exchange({"id": "after", "op": "declarations"})
          after_types = {item["displayName"]: item for item in after["types"]}
          after_functions = {item["displayName"]: item for item in after["functions"]}
          assert after_types["ExecutionState"]["id"] == execution["id"]
          assert after_functions["next_action"]["id"] == next_action["id"]
          timed_out = [
              item
              for item in after_types["ExecutionState"]["typeKind"]["variants"]
              if item["displayName"] == "TimedOut"
          ]
          assert len(timed_out) == 1
          assert exchange({"id": "ready", "op": "executionReadiness"})["kind"] == "ready"
          proc.stdin.close()
          rc = proc.wait(timeout=30)
          if rc != 0:
              raise RuntimeError(proc.stderr.read())

          print("TIMEDOUT_PROBE_IDS", json.dumps({
              "executionStateTypeId": execution["id"],
              "nextActionFunctionId": next_action["id"],
              "timedOutVariantId": timed_out[0]["id"],
              "repairedMatchCount": review["repairedMatchCount"],
          }, separators=(",", ":")))
          PY

          python3 mini-work-planner/materialize.py /tmp/mini-work-planner-timedout.snapshot.json

          for file in             mini-work-planner/planner.snapshot.json             mini-work-planner/declarations.json             mini-work-planner/runner/Generated.cs             mini-work-planner/runner/Program.cs
          do
            echo "NYRWVY_GENERATED_FILE_BEGIN $file"
            base64 -w0 "$file"
            echo
            echo "NYRWVY_GENERATED_FILE_END $file"
          done

      - name: Report encoding comparison
        run: cat /tmp/nyrwvy-encoding-comparison.txt
