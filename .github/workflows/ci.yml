name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  foundation:
    name: F# foundation build and tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore NyamNyam.slnx

      - name: Build
        run: dotnet build NyamNyam.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test NyamNyam.slnx --configuration Release --no-build --no-restore

      - name: Report encoding comparison
        run: cat /tmp/nayamnyam-encoding-comparison.txt
