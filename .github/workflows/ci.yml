name: CI

# GitHub Actions minutes are billed, so CI runs only on demand at major milestones (owner,
# 2026-10-05). Routine changes run the same checks in a local or cloud session before a PR;
# see docs/developer/verification.md.
on:
  workflow_dispatch:
    inputs:
      extended:
        description: Also run the extended suites (scripts/test-extended.fish)
        type: boolean
        default: false
      native_platforms:
        description: Run only native host checks on Linux, macOS and Windows
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    if: ${{ !inputs.native_platforms }}
    name: F# foundation build and fast tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Set up Node for authoring tool contracts
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Bun for adapter unit tests
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set up the Zig version pinned in mise.toml
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.17.0'

      - name: Install locked adapter and typechecking dependencies
        run: npm ci --no-audit --no-fund

      # Installing fish waits mostly on the network and dpkg, so it runs beside the build, which
      # needs every core (running the Node checks there too made the build slower by as much as
      # they took). It writes its log and exit status; the step after the build waits for them.
      - name: Start fish installation beside the build
        run: |
          ( set +e; { sudo apt-get update && sudo apt-get install --yes fish; } > "$RUNNER_TEMP/fish.log" 2>&1; echo $? > "$RUNNER_TEMP/fish.status.tmp"; mv "$RUNNER_TEMP/fish.status.tmp" "$RUNNER_TEMP/fish.status" ) < /dev/null > /dev/null 2>&1 &

      - name: Restore fast test graph
        run: dotnet restore tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj

      - name: Build fast test graph
        run: dotnet build tests/Nyrwvy.Core.Tests/Nyrwvy.Core.Tests.fsproj --configuration Release --no-restore

      - name: Build the native session host
        run: npm run build:host

      - name: Install fish for maintained verification entry points
        run: scripts/ci-wait.sh fish

      - name: Test typed native host reads
        run: npm run test:host

      - name: Check Node test suite ownership
        run: node scripts/check-test-suite-partition.mjs --node-only

      - name: Typecheck maintained adapters and Bun tests
        run: npm run typecheck

      - name: Test shared schemas and typechecking contracts
        run: npm run test:adapters

      - name: Test Bun adapter contracts without live models
        run: npm run test:bun

      - name: Check fish syntax
        run: |
          git ls-files -z '*.fish' | xargs -0 -r -n 1 fish --no-execute

      - name: Test fast suite and authoring tools through the maintained entry point
        run: fish scripts/test-fast.fish --no-build --no-restore

      - name: Test MCP transport contract
        run: node scripts/run-node-tests.mjs fast-mcp

      - name: Test extended suites
        if: ${{ inputs.extended }}
        run: fish scripts/test-extended.fish

  host-platform-smoke:
    if: ${{ inputs.native_platforms }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # PowerShell splits arguments such as -Mroot=a/b.zig at the dot; bash passes them whole.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: '0.17.0'
      - run: npm ci --no-audit --no-fund
      - name: Prime the standalone C# compiler packages
        run: dotnet build tools/zig/host/csharp/Compiler.csproj --configuration Release
      - run: npm run build:host
      - run: npm run test:host
      - name: Test native process lifetime
        run: zig test -O ReleaseSafe tools/zig/host/process_lifetime.zig ${{ runner.os == 'macOS' && '-lc' || '' }}
      - name: Test atomic publication
        run: zig test -O ReleaseSafe tools/zig/host/view_file.zig --test-filter "portable atomic publication" --test-filter "publication identity" ${{ runner.os == 'macOS' && '-lc' || '' }}
      - name: Test native child cleanup
        run: zig test -O ReleaseSafe ${{ runner.os == 'macOS' && '-lc' || '' }} --test-filter child --test-filter "owned process trees" --dep build_info -Mroot=tools/zig/host/run_process.zig -O ReleaseSafe -Mbuild_info=tools/zig/host/build_info.zig
      - name: Exercise native storage and both runtime backends
        run: node --experimental-strip-types scripts/test-native-platform.mjs

