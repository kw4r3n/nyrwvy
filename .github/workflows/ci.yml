name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  foundation:
    name: F# foundation build and fast tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore fast test graph
        run: dotnet restore tests/NyamNyam.Core.Tests/NyamNyam.Core.Tests.fsproj

      - name: Build fast test graph
        run: dotnet build tests/NyamNyam.Core.Tests/NyamNyam.Core.Tests.fsproj --configuration Release --no-restore -m:2 -clp:PerformanceSummary

      - name: Test fast suite
        run: dotnet test tests/NyamNyam.Core.Tests/NyamNyam.Core.Tests.fsproj --configuration Release --no-build --no-restore --settings tests/fast.runsettings

      - name: Report encoding comparison
        run: cat /tmp/nyamnyam-encoding-comparison.txt
